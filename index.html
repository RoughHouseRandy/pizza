<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppa's Pizza</title>
    <!-- Favicon -->
     <link rel="icon" href="images/pizza.jpg">
     <!-- Style sheet -->
      <link rel="stylesheet" href="styles/pizza-styles.css">
</head>

<body>
    <div id="main">
        <div id="header">
            <img src="images/pizzaguy.jpg" alt="cartoon image of a chef holding a pizza">
            <h1>Poppa's Pizza!</h1>
            <h2>Serving GRC students for 50 years!</h2>
            <hr>
            <p>We make the best pizza ever. Visit us today!</p>
            <a id="contact-button" href="#" role="button"> Contact Us</a>
        </div>
        <form id="pizza-form" action="#" method="get">
            <!-- contact info-->
             <fieldset>
                <legend>CONTACT INFO</legend>
                <label for="fname">First name:</label>
                <input type="text" id="fname" name="fname">
                <label for="lname">Last name:</label>
                <input type="text" id="lname" name="lname">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
             </fieldset>
             <fieldset>
                <legend>SELECT PICK UP OR DELIVERY</legend>
                <input type="radio" name="method" id="pickup" value="pickup">
                <label type="radio">Pickup</label>
                <input type="radio" name="method" id="delivery" value="delivery">
                <label type="radio">Delivery</label>
             </fieldset>
             <!-- Order button -->
             <button type="submit" id="order-button">Place Order</button>
        </form>
    </div>
</body>

</html>
