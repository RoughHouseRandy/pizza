<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppa's Pizza</title>
    <!-- Favicon -->
     <link rel="icon" href="images/pizza.jpg">
     <!-- Style sheet -->
      <link rel="stylesheet" href="styles/pizza-styles.css">
</head>

<body>
    <div id="main">
        <div id="header">
            <img src="images/pizzaguy.jpg" alt="cartoon image of a chef holding a pizza">
            <h1>Poppa's Pizza!</h1>
            <h2>Serving GRC students for 50 years!</h2>
            <hr>
            <p>We make the best pizza ever. Visit us today!</p>
            <a id="contact-button" href="#" role="button"> Contact Us</a>
        </div>
        <form id="pizza-form" action="#" method="get">
            <!-- contact info-->
             <fieldset>
                <legend>Contact info</legend>
                <label for="fname">First name:
                    <input type="text" id="fname" name="fname">
                </label>
                <label for="lname">Last name:
                    <input type="text" id="lname" name="lname">
                </label>
                <label for="email">Email:
                    <input type="email" name="email" id="email">
                </label>
             </fieldset>
             <!-- pickup or delivery -->
             <fieldset>
                <legend>Select pickup or delivery</legend>
                <label type="radio">
                    <input type="radio" name="method" id="pickup" value="pickup">Pickup
                </label>
                <label type="radio">
                    <input type="radio" name="method" id="delivery" value="delivery">Delivery
                </label>
             </fieldset>
             <!-- toppings -->
             <fieldset>
                <legend> Select toppings</legend>
                <label for="pepperoni">
                    <input type="checkbox" name="toppings[]" id="pepperoni" value="pepperoni">pepperoni
                </label>
                <label for="cheese">
                    <input type="checkbox" name="toppings[]" id="cheese" value="cheese">Cheese
                </label>
                <label for="chicken">
                    <input type="checkbox" name="toppings[]" id="chicken"value="chicken">Chicken
                </label>
                <label for="mushrooms">
                    <input type="checkbox" name="toppings[]" id="mushrooms"value="mushrooms">Mushrooms
                </label>
                <label for="onions">
                    <input type="checkbox" name="toppings[]" id="onions"value="onions">Onions
                </label> 
                <label for="tomatoes">
                    <input type="checkbox" name="toppings[]" id="tomatoes"value="tomatoes">Tomatoes
                </label>
             </fieldset>
             <!-- pizza size -->
             <fieldset>
                <legend>Pizza size</legend>
                <select id="size" name="size">
                    <option value="none">--Select a Size</option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
             </fieldset>
             <!-- Comment field -->
              <label for="comment">Comments</label>
             <textarea rows="5" id="comment" name="comment"></textarea>
             <!-- Order button -->
             <button type="submit" id="order-button">Place Order</button>
        </form>
    </div>
</body>

</html>
